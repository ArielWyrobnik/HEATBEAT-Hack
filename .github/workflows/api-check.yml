name: API and frontend check

# Tests the backend API (offline, stored data only) and builds the frontend.
on:
  workflow_dispatch:
  pull_request:
    paths: ["heatbeat_api/**", "heatbeat_ranking/**", "heatbeat_data/**", "frontend/**", "tests/test_api.py",
            "requirements-api.txt", ".github/workflows/api-check.yml"]
  push:
    branches: [main]
    paths: ["heatbeat_api/**", "frontend/**", "tests/test_api.py", ".github/workflows/api-check.yml"]

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-api.txt
      - run: python -m pytest -q tests/test_api.py
        env:
          HEATBEAT_LIVE: "0"
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
