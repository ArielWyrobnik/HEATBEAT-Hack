name: Build site ecology and geology

# Fetches protected areas, wetlands, critical habitat, aquifers and bedrock geology per site
# (hosts the cloud sandbox cannot reach) and commits data_pipeline/ecology/raw_site_features.csv.
on:
  workflow_dispatch:
  push:
    paths:
      - "data_pipeline/ecology/*.py"
      - ".github/workflows/build-ecology.yml"

permissions:
  contents: write

concurrency:
  group: build-ecology-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas requests
      - name: Fetch raw features
        timeout-minutes: 30
        run: python -m data_pipeline.ecology.fetch_features
      - name: Score
        run: python -m data_pipeline.ecology.score
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data_pipeline/ecology/raw_site_features.csv data_pipeline/site_ecology.csv
          if git diff --cached --quiet; then echo "no data changes"; exit 0; fi
          git commit -m "data: rebuild site ecology and geology (run ${{ github.run_id }})"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
