name: Build location database

# Fetches real weather and energy data (needs internet, which GitHub runners have),
# writes data/parquet/*.parquet + data/build_report.json and commits them to the branch.
on:
  workflow_dispatch:
  push:
    paths:
      - "data_pipeline/**"
      - ".github/workflows/build-data.yml"

permissions:
  contents: write

concurrency:
  group: build-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore fetch cache
        uses: actions/cache@v4
        with:
          path: data/cache
          key: fetch-cache-${{ github.run_id }}
          restore-keys: fetch-cache-
      - name: Build database
        env:
          PJM_API_KEY: ${{ secrets.PJM_API_KEY }}
        run: python -m data_pipeline.build_db
      - name: Show build report
        run: cat data/build_report.json
      - uses: actions/upload-artifact@v4
        with:
          name: heatbeat-db
          path: |
            data/heatbeat.db
            data/build_report.json
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/parquet data/build_report.json
          if git diff --cached --quiet; then echo "no data changes"; exit 0; fi
          git commit -m "data: rebuild location database (run ${{ github.run_id }})"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Tests
        run: python -m pytest -q
