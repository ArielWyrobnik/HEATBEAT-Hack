    ambient:
      t_db_ideal_c: [-20, 15]
      t_db_tolerable_c: [-30, 35]
      note: "Cold ambient raises efficiency (lower condenser temperature)."
    demand_driver: constant
    seasonality: year_round
    water:
      role: neutral
      need: {value: [0, 0], unit: m3 per MWh_e}
    output: {product: electricity, unit: MWh_e per year}
    economics:
      capex: {value: [2000, 5000], unit: USD per kW_e}
      opex:  {value: [1, 3], unit: percent of capex per year}
    trl: [6, 8]
