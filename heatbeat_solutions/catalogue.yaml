  - id: dac_solid_sorbent
    name: Direct air capture with solid sorbent (temperature vacuum swing)
    category: waste_heat
    description: Regenerate amine sorbent with low grade heat; DC heat usually needs a heat pump booster to about 80 to 100 C.
    heat:
      source_t_min_c: [75, 80]
      source_t_ideal_c: [85, 110]
      process_t_c: [80, 120]
      heat_pump_boost_ok: true
      demand: {value: [1500, 2800], unit: kWh_th per t CO2 (about 5.5 to 10 GJ/t)}
    ambient:
      t_db_ideal_c: [0, 25]
      t_db_tolerable_c: [-20, 40]
      note: "Plus about 300 to 700 kWh_e per t CO2 for fans and vacuum. Humidity affects sorbent uptake."
    demand_driver: constant
    seasonality: year_round
    water:
      role: neutral
      need: {value: [0, 2], unit: m3 per t CO2 (some designs co-produce water)}
    output: {product: CO2 captured, unit: t CO2 per year}
    economics:
      capex: {value: [1000, 3000], unit: USD per t CO2 per year capacity}
      opex:  {value: [100, 300], unit: USD per t CO2}
    trl: [6, 7]
