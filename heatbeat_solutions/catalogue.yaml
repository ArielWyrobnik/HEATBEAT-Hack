  # ---------------------------------------------------------------- enablers (combine with other solutions)
  - id: heat_pump_booster
    name: Industrial heat pump to raise coolant temperature (enabler)
    category: enabler
    description: >
      Lifts coolant heat (25 to 55 C) to 60 to 120 C so that solutions with `heat_pump_boost_ok: true`
      become possible. The screening uses it automatically. COP estimate = carnot_fraction x T_hot / (T_hot - T_cold), in K.
    heat:
      source_t_min_c: [15, 20]
      source_t_ideal_c: [30, 60]
      process_t_c: [60, 120]
      heat_pump_boost_ok: false
      demand: {value: [0.45, 0.55], unit: carnot_fraction}
    ambient:
      t_db_ideal_c: [-30, 45]
      t_db_tolerable_c: [-30, 45]
      note: "Not climate dependent (water source). Above about 90 C output, TRL drops."
    demand_driver: constant
    seasonality: year_round
    water:
      role: neutral
      need: {value: [0, 0], unit: m3 per MWh_th}
    output: {product: lifted heat, unit: MWh_th per year}
    economics:
      capex: {value: [400, 1000], unit: USD per kW_th}
      opex:  {value: [1, 3], unit: percent of capex per year (excl. electricity)}
    trl: [7, 9]
    israel_fit: {rating: medium, note: "Required for most heat uses above 60 C."}
    confidence: literature
    unverified_fields: [economics]
    source_ids: [iea_heat_pumps, engineering_estimate]

