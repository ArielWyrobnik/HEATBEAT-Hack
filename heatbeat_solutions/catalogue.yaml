  # ---------------------------------------------------------------- water
  - id: dry_cooling_free_cooling
    name: Dry coolers and chiller free operation (reduce WUE)
    category: water
    description: >
      Replace evaporative cooling with dry coolers wherever the coolant supply temperature allows.
      With 45 C facility water (Blackwell and Vera Rubin) dry coolers work almost all year, even in hot climates.
    heat:
      source_t_min_c: null
      source_t_ideal_c: null
      process_t_c: null
      heat_pump_boost_ok: false
      demand: null
    ambient:
      t_db_ideal_c: [-30, 35]
      t_db_tolerable_c: [-30, 42]
      note: "Feasible hours = hours with t_db_c below facility_supply_temp_c minus approach (about 3 to 8 K)."
      supply_approach_k: 5
    demand_driver: constant
    seasonality: year_round
    water:
      role: saver
      need: {value: [-1.8, -0.5], unit: L per kWh_IT saved versus evaporative cooling}
    output: {product: water and chiller electricity saved, unit: m3 per year and MWh_e per year}
    economics:
      capex: {value: [100, 300], unit: USD per kW_th dry cooler capacity}
      opex:  {value: [1, 2], unit: percent of capex per year}
    trl: [9, 9]
    israel_fit: {rating: high, note: "Directly addresses water scarcity. Summer peaks above about 40 C in inland Israel need a trim chiller or adiabatic assist."}
    confidence: estimate
    unverified_fields: [water.need, economics]
    source_ids: [nvidia_45c_blog, facilitiesdive_rubin_2026, ashrae_tc99_liquid]

  - id: reclaimed_water_cooling
